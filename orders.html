
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คำสั่งซื้อของฉัน | Phone Sticker Store</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Kanit', sans-serif;
    background: #fffafd;
    color: #302630;
}

header {
    background: white;
    padding: 16px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f5e8ef;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 23px;
    font-weight: 700;
    color: #e78bb5;
    text-decoration: none;
}

nav {
    display: flex;
    gap: 22px;
    align-items: center;
}

nav a {
    text-decoration: none;
    color: #51434d;
    font-size: 14px;
}

.login {
    background: #f5a8ca;
    color: white;
    padding: 9px 20px;
    border-radius: 30px;
}

.container {
    width: 86%;
    max-width: 1100px;
    margin: 45px auto 70px;
}

.heading h1 {
    font-size: 30px;
    margin: 0;
}

.heading p {
    color: #9b8591;
    font-size: 14px;
}

.tabs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin: 30px 0 20px;
    padding-bottom: 5px;
}

.tab {
    border: 1px solid #f0dce7;
    background: white;
    color: #806e78;
    border-radius: 30px;
    padding: 9px 18px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
}

.tab.active {
    background: #e987b5;
    color: white;
    border-color: #e987b5;
}

.order-card {
    background: white;
    border: 1px solid #f2e5ec;
    border-radius: 18px;
    margin-bottom: 18px;
    overflow: hidden;
}

.order-top {
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f4eaf0;
    gap: 10px;
}

.order-number {
    font-weight: 600;
    font-size: 14px;
}

.order-date {
    font-size: 12px;
    color: #a18d98;
}

.status {
    padding: 6px 12px;
    border-radius: 30px;
    font-size: 11px;
    white-space: nowrap;
}

.pending {
    background: #fff2d9;
    color: #b47d27;
}

.paid {
    background: #e7f8ef;
    color: #39835c;
}

.failed {
    background: #ffebeb;
    color: #c04e4e;
}

.shipped {
    background: #eaf2ff;
    color: #4776b8;
}

.completed {
    background: #e7f8ef;
    color: #39835c;
}

.order-body {
    padding: 20px 22px;
}

.order-product {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    font-size: 14px;
    margin: 9px 0;
}

.order-product span {
    color: #796974;
}

.order-bottom {
    border-top: 1px solid #f4eaf0;
    padding: 16px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.total {
    font-size: 17px;
    font-weight: 700;
    color: #e77eae;
}

.detail-btn {
    border: 1px solid #e9a0bf;
    color: #d979a7;
    background: white;
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
}

.empty {
    text-align: center;
    background: white;
    border: 1px solid #f2e5ec;
    border-radius: 20px;
    padding: 65px 15px;
}

.empty-icon { font-size: 65px; }

.empty p { color: #a18d98; }

.shop-btn {
    display: inline-block;
    background: #e987b5;
    color: white;
    padding: 11px 23px;
    border-radius: 12px;
    text-decoration: none;
    margin-top: 12px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #2c202c80;
    z-index: 30;
    padding: 20px;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: white;
    border-radius: 20px;
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close {
    border: none;
    background: #fff0f6;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    cursor: pointer;
    font-size: 18px;
}

.detail-line {
    padding: 12px 0;
    border-bottom: 1px solid #f3e8ee;
    font-size: 13px;
}

.detail-line span {
    color: #9b8591;
}

footer {
    background: white;
    border-top: 1px solid #f5e8ef;
    text-align: center;
    padding: 30px;
    color: #907b88;
}

@media(max-width: 520px) {
    header { padding: 13px 5%; }
    nav { gap: 10px; }
    nav a:not(.login) { display: none; }
    .container { width: 92%; margin-top: 30px; }
    .order-top, .order-bottom {
        align-items: flex-start;
        flex-direction: column;
    }
    .order-body, .order-top, .order-bottom {
        padding-left: 16px;
        padding-right: 16px;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">♡ Phone Sticker</a>
    <nav>
        <a href="index.html">หน้าร้าน</a>
        <a href="cart.html">ตะกร้า 🛒</a>
        <a href="orders.html">คำสั่งซื้อ</a>
        <a href="login.html" class="login">เข้าสู่ระบบ</a>
    </nav>
</header>

<main class="container">

    <div class="heading">
        <h1>คำสั่งซื้อของฉัน 📦</h1>
        <p>ตรวจสอบประวัติและติดตามสถานะคำสั่งซื้อของคุณ</p>
    </div>

    <div class="tabs">
        <button class="tab active" data-filter="all">ทั้งหมด</button>
        <button class="tab" data-filter="pending">รอชำระเงิน</button>
        <button class="tab" data-filter="paid">ชำระแล้ว</button>
        <button class="tab" data-filter="shipped">กำลังจัดส่ง</button>
        <button class="tab" data-filter="completed">สำเร็จ</button>
    </div>

    <div id="orders-container"></div>

</main>

<div class="modal" id="detail-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>รายละเอียดคำสั่งซื้อ</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>
        <div id="modal-body"></div>
    </div>
</div>

<footer>
    <div class="logo">♡ Phone Sticker Store</div>
    <p>อุปกรณ์สร้างคอนเทนต์ที่ทำให้ทุกที่เป็นสตูดิโอของคุณ</p>
    <small>© 2026 Phone Sticker Store. All rights reserved.</small>
</footer>

<script>
const ORDER_KEY = "phoneOrders";

let currentFilter = "all";

function getOrders() {
    try {
        const orders = JSON.parse(localStorage.getItem(ORDER_KEY) || "[]");
        return Array.isArray(orders) ? orders : [];
    } catch {
        return [];
    }
}

function money(amount) {
    return "฿" + Number(amount || 0).toLocaleString("th-TH");
}

function getStatus(order) {
    if (order.orderStatus === "completed") {
        return { label: "สำเร็จแล้ว", class: "completed", filter: "completed" };
    }

    if (order.orderStatus === "shipped") {
        return { label: "กำลังจัดส่ง", class: "shipped", filter: "shipped" };
    }

    if (order.paymentStatus === "failed") {
        return { label: "ชำระเงินไม่สำเร็จ", class: "failed", filter: "failed" };
    }

    if (order.paymentStatus === "paid") {
        return { label: "ชำระเงินแล้ว", class: "paid", filter: "paid" };
    }

    return { label: "รอชำระเงิน", class: "pending", filter: "pending" };
}

function formatDate(date) {
    return new Date(date).toLocaleString("th-TH", {
        dateStyle: "medium",
        timeStyle: "short"
    });
}

function renderOrders() {
    const orders = getOrders();
    const container = document.getElementById("orders-container");

    container.innerHTML = "";

    const filtered = orders.filter(order => {
        if (currentFilter === "all") return true;
        return getStatus(order).filter === currentFilter;
    });

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🛍️</div>
                <h2>ยังไม่มีคำสั่งซื้อ</h2>
                <p>เมื่อคุณสั่งซื้อสินค้า รายการจะแสดงที่นี่</p>
                <a href="index.html" class="shop-btn">เลือกซื้อสินค้า</a>
            </div>
        `;
        return;
    }

    filtered.forEach(order => {
        const status = getStatus(order);

        const card = document.createElement("div");
        card.className = "order-card";

        const top = document.createElement("div");
        top.className = "order-top";

        const number = document.createElement("div");
        number.innerHTML = `
            <div class="order-number"></div>
            <div class="order-date"></div>
        `;

        number.querySelector(".order-number").textContent =
            "คำสั่งซื้อ #" + order.id;

        number.querySelector(".order-date").textContent =
            formatDate(order.date);

        const badge = document.createElement("span");
        badge.className = "status " + status.class;
        badge.textContent = status.label;

        top.append(number, badge);

        const body = document.createElement("div");
        body.className = "order-body";

        (order.items || []).forEach(item => {
            const row = document.createElement("div");
            row.className = "order-product";

            const name = document.createElement("span");
            name.textContent = item.name + " × " + item.quantity;

            const price = document.createElement("strong");
            price.textContent = money(item.price * item.quantity);

            row.append(name, price);
            body.appendChild(row);
        });

        const bottom = document.createElement("div");
        bottom.className = "order-bottom";

        const total = document.createElement("div");
        total.innerHTML = `ยอดรวม <span class="total"></span>`;
        total.querySelector(".total").textContent = money(order.total);

        const button = document.createElement("button");
        button.className = "detail-btn";
        button.textContent = "ดูรายละเอียด →";
        button.addEventListener("click", () => showDetails(order.id));

        bottom.append(total, button);

        card.append(top, body, bottom);
        container.appendChild(card);
    });
}

function showDetails(id) {
    const order = getOrders().find(item => item.id === id);

    if (!order) return;

    const customer = order.customer || {};
    const modal = document.getElementById("modal-body");

    modal.innerHTML = "";

    const lines = [
        ["หมายเลขคำสั่งซื้อ", order.id],
        ["วันที่สั่งซื้อ", formatDate(order.date)],
        ["ผู้รับสินค้า", customer.fullname],
        ["เบอร์โทรศัพท์", customer.phone],
        ["ที่อยู่", [
            customer.address,
            customer.subdistrict,
            customer.district,
            customer.province,
            customer.postcode
        ].filter(Boolean).join(" ")],
        ["วิธีชำระเงิน", order.paymentMethod === "promptpay" ? "PromptPay" : "Stripe"],
        ["สถานะชำระเงิน", order.paymentStatus],
        ["สถานะคำสั่งซื้อ", order.orderStatus],
        ["ค่าจัดส่ง", money(order.shipping)],
        ["ยอดรวม", money(order.total)]
    ];

    lines.forEach(([label, value]) => {
        const div = document.createElement("div");
        div.className = "detail-line";

        const labelElement = document.createElement("span");
        labelElement.textContent = label + ": ";

        const valueElement = document.createElement("strong");
        valueElement.textContent = value || "-";

        div.append(labelElement, valueElement);
        modal.appendChild(div);
    });

    document.getElementById("detail-modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("detail-modal").style.display = "none";
}

document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(tab => {
            tab.classList.remove("active");
        });

        button.classList.add("active");
        currentFilter = button.dataset.filter;
        renderOrders();
    });
});

document.getElementById("detail-modal").addEventListener("click", event => {
    if (event.target.id === "detail-modal") closeModal();
});

renderOrders();
</script>

</body>
</html>
